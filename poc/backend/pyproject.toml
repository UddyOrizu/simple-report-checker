[project]
name = "claim-checker-poc"
version = "0.1.0"
description = "Claim validation POC — ingestion, extraction, verification pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.5",
    "agno>=1.1.0",
    "spacy>=3.7",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "python-dotenv==1.1.0",
    "truststore==0.10.4",
    "openai==1.77.0",
    "anthropic>=0.40",
    "tiktoken==0.14.0",
    "beautifulsoup4==4.15.0",
    "jsonpickle==4.1.2",
    "yfinance==1.7.0",
    "markdownify>=0.13",
    "huggingface_hub>=0.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
